name: Build & Release Jarvis 2.0 Windows EXE

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Read package version
        id: app-version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Could not read package version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build frontend & portable package
        run: npm run build:exe

      - name: Compile standalone launcher Jarvis-2.0-Launcher.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            & $csc /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:"$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\System.Web.Extensions.dll" /out:"release\Jarvis-2.0-Windows-Portable\Jarvis-2.0.exe" "release\Jarvis-2.0-Windows-Portable\JarvisLauncher.cs"
          }
          Compress-Archive -Path "release\Jarvis-2.0-Windows-Portable\*" -DestinationPath "release\Jarvis-2.0-Windows-Portable.zip" -Force

      - name: Build Electron NSIS & Portable EXE
        shell: pwsh
        run: |
          npx electron-builder --win nsis portable --x64 --publish never
        continue-on-error: true

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          if (Test-Path "out\*.exe") {
            Copy-Item "out\*.exe" -Destination "artifacts\" -Force
          }
          if (Test-Path "release\Jarvis-2.0-Windows-Portable\Jarvis-2.0.exe") {
            Copy-Item "release\Jarvis-2.0-Windows-Portable\Jarvis-2.0.exe" -Destination "artifacts\Jarvis-2.0-Launcher.exe" -Force
          }
          if (Test-Path "release\Jarvis-2.0-Windows-Portable.zip") {
            Copy-Item "release\Jarvis-2.0-Windows-Portable.zip" -Destination "artifacts\" -Force
          }
          Get-ChildItem "artifacts"

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-2.0-Windows-EXE
          path: artifacts/*

      - name: Publish GitHub Release v${{ steps.app-version.outputs.version }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.app-version.outputs.version }}"
          $tag = "v$version"
          $notes = @"
          ## 🚀 Jarvis $version — Édition PC Autonome (Sans Backend)

          ### Nouveautés de cette version
          - Accès à distance pour Jarvis Android : le téléphone pilote ce PC de partout (4G, autre Wi-Fi) par Tailscale, réseau privé chiffré et gratuit, sans port à ouvrir ; le Wi-Fi local est fermé (bouton « Passer en Wi-Fi local » pour l’ancien fonctionnement). Installez Tailscale sur le PC et le téléphone avec le même compte, puis appairez de nouveau le téléphone.
          - Images de meilleure qualité : sampler DPM++ 2M SDE Karras, base anti-défauts (mains, anatomie, flou), styles Photo/Anime/Brut, passe HD facultative, choix du modèle, graine fixe, plusieurs images et variations dans Studio IA › Images. Les demandes de mineurs restent toujours refusées.
          - Commande /image dans le chat : « /image description » envoie la demande directement au générateur d’images du PC, sans passer par l’assistant (réglage 18+ de l’utilisateur ; aucune image de mineur).
          - Studio IA › Images : créez vos images vous-même (description, format, étapes) directement avec ComfyUI, Forge ou Fooocus, sans passer par l’assistant ; case 18+ partagée avec les Réglages, installation de ComfyUI depuis l’onglet.
          - Images pour adultes sur le PC : nouveau réglage « Autoriser le contenu adulte (18+) » (désactivé par défaut, confirmation à l’activation) ; les demandes d’enfants ou de mineurs restent toujours refusées.
          - Images avec ComfyUI : raison précise des échecs, journal de démarrage (`images-ia\comfyui.log`) avec conseil (Visual C++, pilotes, mémoire, port), liste des modèles plus fiable, travail trop long interrompu, téléchargement du modèle repris après coupure, ComfyUI Desktop reconnu ; nouvel outil `generate_image` pour créer une image directement sur le PC (rangée dans Images\Jarvis).
          - Panneau Productivité : suppression avec annulation, ajout d’événements, abonnements, habitudes, anniversaires et souvenirs, budgets mensuels avec barres, listes de tâches personnalisées. Clés API et jeton Home Assistant plus jamais écrits en clair.

          Adaptation complète sur PC (Windows x64) de **Jarvis-Android v0.9.53**, fonctionnant de manière 100% autonome sans serveur backend externe.

          ### 📦 Fichiers téléchargeables dans cette Release
          - **`Jarvis-2.0-Setup.exe`** : Installateur Windows x64 autonome (Electron NSIS) avec raccourci Bureau et menu Démarrer.
          - **`Jarvis-2.0-Windows-Portable.zip`** : Archive portable autonome contenant `Jarvis-2.0.exe` et toutes les ressources 3D/spatiales/plugins.

          ### ✨ Nouveautés & Fonctionnalités
          - **Avatar 3D & Lip-Sync** : Classique (personnalisable), Léa et Marc; densité réglable de 20k à 148k polygones, circuits PCB ON/OFF, 23 coiffures, 11 teintes de cheveux, créateur de personnage (20 curseurs), hologramme/peau et lip-sync synchronisé sur l'audio.
          - **Audio & IA** : Gemini Live WebSocket (24 kHz PCM + analyse formantique F1/F2), repli REST avec rotation de clés, 30 voix Gemini, et moteur local même sans clé API.
          - **Contrôle PC & Vision** : applications, souris/clavier/fenêtres, volume/luminosité/média, gestionnaire de fenêtres/processus, capture d'écran, webcam, WhatsApp Web & Email.
          - **Carte monde, vols & satellites** : avions ADS-B cliquables avec télémétrie, route et identification lorsqu'elles sont disponibles; catalogue CelesTrak TLE avec fiches détaillées, ISS/Tiangong/Hubble, carte du ciel, lancements, séismes et aurores.
          - **Plugins corrigés** : 82 plugins JSON avec rendu des structures de réponses, validation des paramètres et routines PC; catalogue rechargable dans l'interface.
          - **Médias & Productivité** : radios, podcasts, YouTube, génération de PDF/Word/Excel/CSV/Markdown, Obsidian, tâches, agenda, minuteurs, dépenses et habitudes.
          "@
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Increment package.json to preserve previously published tags."
          }
          gh release create $tag (Get-ChildItem "artifacts\*" | ForEach-Object { $_.FullName }) --title "Jarvis $version — Édition PC Autonome (.exe sans backend)" --notes $notes --target "${{ github.sha }}"
