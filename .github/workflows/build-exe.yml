name: Build Jarvis 2.0 Windows EXE

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build standalone Windows .exe (NSIS + Portable)
        run: npm run dist:win

      - name: Upload Windows .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-2.0-Windows-EXE
          path: out/*.exe
